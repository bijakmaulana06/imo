<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Starfield Background</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      min-height: 200vh;
      background: transparent;
      overflow-x: hidden;
    }

    /* Canvas Container */
    #canvas-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(180deg, #020510 0%, #050917 50%, #080d1e 100%);
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Dark Space Vignette Contrast Overlay */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background-color: rgba(2, 5, 16, 0.35);
      background-image: radial-gradient(ellipse at center, transparent 20%, rgba(2, 5, 16, 0.85) 100%);
    }

    /* CSS Fallback (Mobile / WebGL Not Supported) */
    .css-fallback {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      background-color: #020510;
    }
    .css-fallback.active {
      display: block;
    }
    .css-stars {
      position: absolute;
      inset: 0;
      opacity: 0.8;
      background-image: 
        radial-gradient(1.5px 1.5px at 15% 15%, rgba(255, 255, 255, 0.9), transparent),
        radial-gradient(2px 2px at 35% 45%, rgba(125, 249, 255, 0.8), transparent),
        radial-gradient(1px 1px at 60% 25%, rgba(255, 255, 255, 0.7), transparent),
        radial-gradient(2.5px 2.5px at 80% 70%, rgba(180, 140, 255, 0.85), transparent),
        radial-gradient(1.5px 1.5px at 25% 85%, rgba(255, 255, 255, 0.75), transparent),
        radial-gradient(2px 2px at 70% 15%, rgba(125, 249, 255, 0.9), transparent),
        radial-gradient(1px 1px at 90% 40%, rgba(255, 255, 255, 0.8), transparent);
      background-size: 250px 250px;
    }
    .nebula-cloud-1 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(125,249,255,0.12) 0%, rgba(180,140,255,0.08) 35%, transparent 70%);
      filter: blur(64px);
    }
    .nebula-cloud-2 {
      position: absolute;
      bottom: 25%;
      right: 25%;
      width: 600px;
      height: 600px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,113,206,0.1) 0%, rgba(0,240,255,0.05) 45%, transparent 70%);
      filter: blur(64px);
    }
    .fallback-vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 25%, rgba(2,5,16,0.85) 100%);
    }

    /* Download Image UI Button */
    .download-btn {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 99;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.9) 0%, rgba(30, 41, 59, 0.9) 100%);
      color: #7df9ff;
      border: 1px solid rgba(125, 249, 255, 0.5);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 14px 26px;
      border-radius: 30px;
      font-family: system-ui, -apple-system, sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: all 0.3s ease;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      letter-spacing: 0.02em;
    }
    .download-btn:hover {
      background: linear-gradient(135deg, rgba(125, 249, 255, 0.25) 0%, rgba(180, 140, 255, 0.25) 100%);
      border-color: #7df9ff;
      color: #ffffff;
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 35px rgba(125, 249, 255, 0.35);
    }
    .download-btn:active {
      transform: translateY(0) scale(1.0);
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- WebGL Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Vignette Overlay -->
  <div class="vignette-overlay"></div>

  <!-- CSS Starfield Fallback -->
  <div id="css-fallback" class="css-fallback">
    <div class="css-stars"></div>
    <div class="nebula-cloud-1"></div>
    <div class="nebula-cloud-2"></div>
    <div class="fallback-vignette"></div>
  </div>

  <!-- Screenshot / Download Button -->
  <button id="downloadBtn" class="download-btn">
    🚀 Export 8K Ultra-HD (7680x4320)
  </button>

  <script>
    /* ─────────────────────── WebGL Support Check ─────────────────────── */
    function checkWebGLSupport() {
      if (typeof window === "undefined") return false;
      try {
        const canvas = document.createElement("canvas");
        return !!(
          window.WebGLRenderingContext &&
          (canvas.getContext("webgl") || canvas.getContext("experimental-webgl"))
        );
      } catch (e) {
        return false;
      }
    }

    if (!checkWebGLSupport()) {
      document.getElementById("canvas-container").style.display = "none";
      document.getElementById("css-fallback").classList.add("active");
    } else {
      initStarfield();
    }

    function initStarfield() {
      const container = document.getElementById("canvas-container");
      
      // Scene, Camera, Renderer
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 200);
      camera.position.set(0, 5.5, 18);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: "high-performance",
        failIfMajorPerformanceCaveat: false,
        preserveDrawingBuffer: true
      });
      
      const pixelRatio = Math.min(window.devicePixelRatio, 2.0);
      renderer.setPixelRatio(pixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      container.appendChild(renderer.domElement);

      // Ambient Light
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      /* ─────────────────────── 1. Ultra High-Res Soft Glow Texture (512x512) ─────────────────────── */
      function createUltraGlowTexture() {
        const canvas = document.createElement("canvas");
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext("2d");
        if (!ctx) return null;

        const gradient = ctx.createRadialGradient(256, 256, 0, 256, 256, 256);
        gradient.addColorStop(0, "rgba(255, 255, 255, 1)");
        gradient.addColorStop(0.15, "rgba(255, 255, 255, 0.9)");
        gradient.addColorStop(0.4, "rgba(255, 255, 255, 0.35)");
        gradient.addColorStop(0.7, "rgba(255, 255, 255, 0.08)");
        gradient.addColorStop(1, "rgba(255, 255, 255, 0)");

        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 512, 512);

        const texture = new THREE.CanvasTexture(canvas);
        texture.needsUpdate = true;
        return texture;
      }

      const glowTexture = createUltraGlowTexture();

      /* ─────────────────────── 2. Ultra-Dense Galaxy Particle System (85,000 Particles) ─────────────────────── */
      const isMobile = window.innerWidth < 768;
      const PARTICLE_COUNT = isMobile ? 30000 : 85000;
      const ARMS = 5;
      const SPIRAL_TIGHTNESS = 0.32;
      const GALAXY_RADIUS = 26;
      const GALAXY_THICKNESS = 1.0;
      const HORIZONTAL_SCALE = 1.75;

      const galaxyGeometry = new THREE.BufferGeometry();
      const positions = new Float32Array(PARTICLE_COUNT * 3);
      const colors = new Float32Array(PARTICLE_COUNT * 3);
      const sizes = new Float32Array(PARTICLE_COUNT);
      const randomOffsets = new Float32Array(PARTICLE_COUNT);

      const colorCore = new THREE.Color("#7df9ff");
      const colorMid = new THREE.Color("#00f0ff");
      const colorOuter = new THREE.Color("#b48cff");
      const colorDust = new THREE.Color("#ff71ce");
      const colorCyan = new THREE.Color("#00f0ff");
      const colorDeepPurple = new THREE.Color("#818cf8");

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        const randType = Math.random();

        let x, y, z;
        const mixColor = new THREE.Color();

        if (randType < 0.22) {
          // Central Core
          const r = Math.pow(Math.random(), 3.2) * GALAXY_RADIUS * 0.25;
          const theta = Math.random() * Math.PI * 2;
          x = Math.cos(theta) * r * HORIZONTAL_SCALE;
          z = Math.sin(theta) * r;
          y = (Math.random() - 0.5) * GALAXY_THICKNESS * 0.6;

          mixColor.lerpColors(colorCore, colorMid, Math.random() * 0.6);
          sizes[i] = Math.random() * 2.8 + 1.2;
        } else if (randType < 0.85) {
          // Smooth Spiral Arms
          const armIndex = Math.floor(Math.random() * ARMS);
          const armAngle = (armIndex / ARMS) * Math.PI * 2;

          const distanceRatio = Math.pow(Math.random(), 1.15);
          const r = distanceRatio * GALAXY_RADIUS;

          const spiralAngle = armAngle + r * SPIRAL_TIGHTNESS;
          const scatterMagnitude = (Math.random() - 0.5) * (Math.random() - 0.5) * 5.0 * (0.2 + distanceRatio * 0.8);

          x = (Math.cos(spiralAngle) * r + Math.cos(spiralAngle + Math.PI / 2) * scatterMagnitude) * HORIZONTAL_SCALE;
          z = Math.sin(spiralAngle) * r + Math.sin(spiralAngle + Math.PI / 2) * scatterMagnitude;
          y = (Math.random() - 0.5) * GALAXY_THICKNESS * (1.3 - distanceRatio * 0.5);

          if (distanceRatio < 0.3) {
            mixColor.lerpColors(colorCore, colorMid, distanceRatio / 0.3);
          } else if (distanceRatio < 0.7) {
            mixColor.lerpColors(colorMid, colorCyan, (distanceRatio - 0.3) / 0.4);
          } else {
            mixColor.lerpColors(colorOuter, colorDust, (distanceRatio - 0.7) / 0.3);
          }

          sizes[i] = Math.random() * 2.2 + 0.5;
        } else {
          // Ambient Outer Disk Halo
          const r = Math.random() * GALAXY_RADIUS * 1.4;
          const theta = Math.random() * Math.PI * 2;
          x = Math.cos(theta) * r * HORIZONTAL_SCALE;
          z = Math.sin(theta) * r;
          y = (Math.random() - 0.5) * GALAXY_THICKNESS * 2.2;

          mixColor.lerpColors(colorOuter, colorDeepPurple, Math.random());
          sizes[i] = Math.random() * 1.5 + 0.3;
        }

        const brightness = 0.65 + Math.random() * 0.35;
        mixColor.multiplyScalar(brightness);

        positions[i3] = x;
        positions[i3 + 1] = y;
        positions[i3 + 2] = z;

        colors[i3] = mixColor.r;
        colors[i3 + 1] = mixColor.g;
        colors[i3 + 2] = mixColor.b;

        randomOffsets[i] = Math.random() * Math.PI * 2;
      }

      galaxyGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      galaxyGeometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));
      galaxyGeometry.setAttribute("aSize", new THREE.BufferAttribute(sizes, 1));
      galaxyGeometry.setAttribute("aOffset", new THREE.BufferAttribute(randomOffsets, 1));

      const galaxyShaderMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uPixelRatio: { value: pixelRatio },
        },
        vertexShader: `
          attribute float aSize;
          attribute float aOffset;
          uniform float uTime;
          uniform float uPixelRatio;
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            vColor = color;

            vec4 modelPosition = modelMatrix * vec4(position, 1.0);
            vec4 viewPosition = viewMatrix * modelPosition;
            vec4 projectedPosition = projectionMatrix * viewPosition;
            gl_Position = projectedPosition;

            float twinkle = 0.6 + 0.4 * sin(uTime * 2.0 + aOffset * 6.28);
            vAlpha = twinkle;

            gl_PointSize = aSize * uPixelRatio * 45.0 * (1.0 / -viewPosition.z);
            gl_PointSize = max(gl_PointSize, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;

            float strength = 1.0 - (dist * 2.0);
            strength = pow(strength, 1.6);

            float core = 1.0 - smoothstep(0.0, 0.12, dist);

            vec3 finalColor = vColor * strength + vec3(0.5, 0.8, 1.0) * core * 0.3;
            float alpha = strength * vAlpha * 0.85;

            gl_FragColor = vec4(finalColor, alpha);
          }
        `,
        vertexColors: true,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      const galaxyParticles = new THREE.Points(galaxyGeometry, galaxyShaderMaterial);
      scene.add(galaxyParticles);

      /* ─────────────────────── 3. Organic Nebula Clouds ─────────────────────── */
      const NEBULA_COUNT = 350;
      const nebulaGeometry = new THREE.BufferGeometry();
      const nebulaPositions = new Float32Array(NEBULA_COUNT * 3);
      const nebulaColors = new Float32Array(NEBULA_COUNT * 3);

      const nebulaColorsList = [
        new THREE.Color("#7df9ff"),
        new THREE.Color("#b48cff"),
        new THREE.Color("#ff71ce"),
        new THREE.Color("#00f0ff"),
      ];

      for (let i = 0; i < NEBULA_COUNT; i++) {
        const i3 = i * 3;
        const r = Math.random() * 26;
        const theta = Math.random() * Math.PI * 2;
        const y = (Math.random() - 0.5) * 6;

        nebulaPositions[i3] = Math.cos(theta) * r * HORIZONTAL_SCALE;
        nebulaPositions[i3 + 1] = y;
        nebulaPositions[i3 + 2] = Math.sin(theta) * r;

        const baseColor = nebulaColorsList[Math.floor(Math.random() * nebulaColorsList.length)];
        nebulaColors[i3] = baseColor.r;
        nebulaColors[i3 + 1] = baseColor.g;
        nebulaColors[i3 + 2] = baseColor.b;
      }

      nebulaGeometry.setAttribute("position", new THREE.BufferAttribute(nebulaPositions, 3));
      nebulaGeometry.setAttribute("color", new THREE.BufferAttribute(nebulaColors, 3));

      const nebulaMaterial = new THREE.PointsMaterial({
        map: glowTexture || null,
        vertexColors: true,
        size: 15,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.06,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      const nebulaClouds = new THREE.Points(nebulaGeometry, nebulaMaterial);
      scene.add(nebulaClouds);

      /* ─────────────────────── 4. Background Star Field (15,000 Micro-Stars) ─────────────────────── */
      const BG_STAR_COUNT = 15000;
      const bgStarGeometry = new THREE.BufferGeometry();
      const bgStarPositions = new Float32Array(BG_STAR_COUNT * 3);
      const bgStarColors = new Float32Array(BG_STAR_COUNT * 3);

      const starPalette = [
        new THREE.Color("#ffffff"),
        new THREE.Color("#7db8ff"),
        new THREE.Color("#a5f3fc"),
        new THREE.Color("#e9d5ff"),
        new THREE.Color("#fef08a")
      ];

      for (let i = 0; i < BG_STAR_COUNT; i++) {
        const i3 = i * 3;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        const r = 35 + Math.random() * 110;

        bgStarPositions[i3] = r * Math.sin(phi) * Math.cos(theta) * 1.6;
        bgStarPositions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        bgStarPositions[i3 + 2] = r * Math.cos(phi);

        const chosenColor = starPalette[Math.floor(Math.random() * starPalette.length)].clone();
        chosenColor.multiplyScalar(0.7 + Math.random() * 0.3);

        bgStarColors[i3] = chosenColor.r;
        bgStarColors[i3 + 1] = chosenColor.g;
        bgStarColors[i3 + 2] = chosenColor.b;
      }

      bgStarGeometry.setAttribute("position", new THREE.BufferAttribute(bgStarPositions, 3));
      bgStarGeometry.setAttribute("color", new THREE.BufferAttribute(bgStarColors, 3));

      const bgStarMaterial = new THREE.PointsMaterial({
        map: glowTexture || null,
        vertexColors: true,
        size: 1.4,
        sizeAttenuation: true,
        transparent: true,
        opacity: 0.75,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
      });

      const backgroundStars = new THREE.Points(bgStarGeometry, bgStarMaterial);
      scene.add(backgroundStars);

      /* ─────────────────────── 5. Camera Rig & Interactions ─────────────────────── */
      let targetScrollY = 0;
      let currentScrollY = 0;
      let pointerX = 0;
      let pointerY = 0;

      function handleScroll() {
        const maxScroll = Math.max(document.documentElement.scrollHeight - window.innerHeight, 1);
        targetScrollY = Math.min(Math.max(window.scrollY / maxScroll, 0), 1);
      }

      function handleMouseMove(e) {
        const x = (e.clientX / window.innerWidth) * 2 - 1;
        const y = -(e.clientY / window.innerHeight) * 2 + 1;
        pointerX = x * 2.5;
        pointerY = y * 1.2;
      }

      window.addEventListener("scroll", handleScroll, { passive: true });
      window.addEventListener("resize", handleScroll, { passive: true });
      window.addEventListener("mousemove", handleMouseMove, { passive: true });
      handleScroll();

      // Damp function helper
      function damp(current, target, lambda, dt) {
        if (THREE.MathUtils && THREE.MathUtils.damp) {
          return THREE.MathUtils.damp(current, target, lambda, dt);
        }
        return current + (target - current) * (1 - Math.exp(-lambda * dt));
      }

      // Animation Loop
      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);

        const delta = clock.getDelta();
        const elapsed = clock.getElapsedTime();

        // Rotations
        galaxyParticles.rotation.y = elapsed * 0.045;
        galaxyShaderMaterial.uniforms.uTime.value = elapsed;
        nebulaClouds.rotation.y = elapsed * 0.02;
        backgroundStars.rotation.y = elapsed * 0.012;

        // Smooth Camera Movement
        currentScrollY = damp(currentScrollY, targetScrollY, 4, delta);

        const idleX = Math.sin(elapsed * 0.15) * 2.5 + pointerX;
        const idleY = 5.5 + Math.sin(elapsed * 0.12) * 1.0 + pointerY;
        const idleZ = 18 + Math.cos(elapsed * 0.1) * 1.5;

        const scrollZ = currentScrollY * -10;
        const scrollX = Math.sin(currentScrollY * Math.PI) * 5;
        const scrollY_pos = currentScrollY * -2;

        const targetX = idleX + scrollX;
        const targetY = idleY + scrollY_pos;
        const targetZ = idleZ + scrollZ;

        camera.position.x = damp(camera.position.x, targetX, 3, delta);
        camera.position.y = damp(camera.position.y, targetY, 3, delta);
        camera.position.z = damp(camera.position.z, targetZ, 3, delta);

        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
      }

      animate();

      // Window Resize Listener
      window.addEventListener("resize", () => {
        const width = window.innerWidth;
        const height = window.innerHeight;

        camera.aspect = width / height;
        camera.updateProjectionMatrix();

        renderer.setSize(width, height);
        const newRatio = Math.min(window.devicePixelRatio, 2.0);
        renderer.setPixelRatio(newRatio);
        galaxyShaderMaterial.uniforms.uPixelRatio.value = newRatio;
      });

      /* ─────────────────────── Master 8K Ultra-HD High-Precision Export Engine ─────────────────────── */
      function downloadScreenshot() {
        const downloadBtn = document.getElementById("downloadBtn");
        const originalText = downloadBtn.innerHTML;
        downloadBtn.innerHTML = "⏳ Generating 8K Ultra-HD Image...";
        downloadBtn.style.opacity = "0.7";

        setTimeout(() => {
          try {
            // Absolute 8K Ultra HD Resolution: 7680px width
            const targetWidth = 7680;
            const targetHeight = Math.round(targetWidth / (window.innerWidth / window.innerHeight));

            // Dedicated high-precision WebGL renderer
            const offscreenRenderer = new THREE.WebGLRenderer({
              antialias: true,
              alpha: true,
              preserveDrawingBuffer: true,
              powerPreference: "high-performance"
            });

            offscreenRenderer.setSize(targetWidth, targetHeight);
            offscreenRenderer.setPixelRatio(1.0);

            // Scale shader point size relative to 8K resolution
            const scaleFactor = targetWidth / window.innerWidth;
            galaxyShaderMaterial.uniforms.uPixelRatio.value = scaleFactor * 0.75;

            // Render crisp 8K scene
            offscreenRenderer.render(scene, camera);

            // 8K Canvas with deep dark gradient
            const exportCanvas = document.createElement("canvas");
            exportCanvas.width = targetWidth;
            exportCanvas.height = targetHeight;
            const ctx = exportCanvas.getContext("2d");

            const bgGrad = ctx.createLinearGradient(0, 0, 0, targetHeight);
            bgGrad.addColorStop(0, "#020510");
            bgGrad.addColorStop(0.5, "#050917");
            bgGrad.addColorStop(1, "#080d1e");
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, targetWidth, targetHeight);

            ctx.drawImage(offscreenRenderer.domElement, 0, 0);

            // Export uncompressed maximum quality PNG image
            const imageURL = exportCanvas.toDataURL("image/png", 1.0);
            const link = document.createElement("a");
            link.download = `starfield-8K-extreme-${targetWidth}x${targetHeight}-${Date.now()}.png`;
            link.href = imageURL;
            link.click();

            // Cleanup offscreen GPU resources
            offscreenRenderer.dispose();
          } catch (err) {
            console.error("8K Export Error:", err);
            alert("Error exporting 8K image: " + err.message);
          } finally {
            // Restore interactive uPixelRatio
            galaxyShaderMaterial.uniforms.uPixelRatio.value = Math.min(window.devicePixelRatio, 2.0);
            downloadBtn.innerHTML = originalText;
            downloadBtn.style.opacity = "1";
          }
        }, 50);
      }

      document.getElementById("downloadBtn").addEventListener("click", downloadScreenshot);
      window.addEventListener("keydown", (e) => {
        if (e.key === "s" || e.key === "S") {
          downloadScreenshot();
        }
      });
    }
  </script>
</body>
</html>
